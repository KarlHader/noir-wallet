<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Noir Wallet is the privacy-first multichain wallet. Send funds and use DeFi without exposing your balance, positions, or on-chain identity."
    />
    <title>Noir Wallet - The Privacy DeFi Entryway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000&family=Doto:wght@400&display=swap"
      rel="stylesheet"
    />
    <script>
      if (window.location.hostname === 'noir-wallet.pages.dev') {
        window.location.replace(
          'https://www.zknoir.com' + window.location.pathname + window.location.search
        )
      }
    </script>
    <script>
      // Only the home page uses the page-wide rules in src/home/site.css. /frost and /v2/beta (see
      // App.tsx) keep the Tailwind theme, which loads with them. Mark the page before the first paint.
      document.documentElement.dataset.page = /^\/(frost|v2\/beta)\/?$/.test(
        window.location.pathname
      )
        ? 'app'
        : 'home'
    </script>
    <style>
      :root[data-page='app'] {
        background: #12121c;
      }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QZZD28T937"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-QZZD28T937')
      gtag('config', 'AW-18227802851')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
