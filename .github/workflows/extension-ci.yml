name: Extension CI

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/extension/**'
      - '!packages/extension/**/*.md'
      - 'packages/sdk/package.json'
      - 'packages/evm-history-worker/**'
      - '!packages/evm-history-worker/**/*.md'
      - 'scripts/extension-release.mjs'
      - 'scripts/lib/extension-release-history.mjs'
      - 'scripts/extract-changelog.mjs'
      - 'scripts/extension-preview-comment.mjs'
      - 'scripts/wasm-package.mjs'
      - 'scripts/lib/wasm-package-integrity.mjs'
      - 'scripts/run-core-tests.mjs'
      - 'scripts/register-test-loader.mjs'
      - 'scripts/typescript-test-loader.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'LICENSE'
      - 'tsconfig.base.json'
      - '.npmrc'
      - 'wasm-package.lock.json'
      - '.github/workflows/extension-ci.yml'
      - '.github/workflows/extension-release.yml'
      - '.github/workflows/extension-preview-comment.yml'
      - '.github/workflows/extension-preview-config.yml'

concurrency:
  group: extension-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  HUSKY: 0

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PREVIEW_BUILD_CHANNEL: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'beta' || 'development' }}
    steps:
      - name: Download public preview configuration
        if: github.event.pull_request.head.repo.full_name != github.repository && github.repository == 'NoirWallet/noir-wallet'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_ids=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/extension-preview-config.yml/runs?branch=main&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(
              (.event == "push" or .event == "workflow_dispatch" or .event == "schedule") and
              .head_repository.id == .repository.id
            ) | .id')
          run_id=${run_ids%%$'\n'*}
          if [[ -z "$run_id" ]]; then
            echo '::warning::Public preview configuration has not been published; building without RHEA Swap'
          else
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name extension-public-preview-config \
              --dir "$RUNNER_TEMP/noir-public-preview-config"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: wallet
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: wallet/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: wallet/.node-version
          cache: pnpm
          cache-dependency-path: wallet/pnpm-lock.yaml
      - name: Verify the tested merge commit
        id: source
        run: |
          set -euo pipefail
          test "$(git -C wallet rev-parse HEAD)" = "$GITHUB_SHA"
      - run: pnpm install --frozen-lockfile
        working-directory: wallet
      - name: Type-check V2 EVM history Worker
        run: pnpm --filter @noir-wallet/evm-history-worker type-check
        working-directory: wallet
      - run: pnpm test
        working-directory: wallet
      - name: Build and type-check fork extension
        if: github.event.pull_request.head.repo.full_name != github.repository
        working-directory: wallet
        env:
          BUILD_CHANNEL: development
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { existsSync, readFileSync } from 'node:fs'
          import { join } from 'node:path'
          const file = join(process.env.RUNNER_TEMP, 'noir-public-preview-config', 'fork-build-env.json')
          const config = existsSync(file) ? JSON.parse(readFileSync(file, 'utf8')) : {}
          const allowed = new Set(['RHEA_SWAP_ACCESS_TOKEN', 'EVM_HISTORY_API_ORIGIN'])
          if (!config || typeof config !== 'object' || Array.isArray(config) ||
              Object.entries(config).some(([key, value]) => !allowed.has(key) || typeof value !== 'string')) {
            throw new Error('Invalid public preview configuration')
          }
          const result = spawnSync('pnpm', ['build:extension'], {
            env: { ...process.env, RHEA_SWAP_ACCESS_TOKEN: '', ...config }, stdio: 'inherit'
          })
          if (result.error) throw result.error
          process.exitCode = result.status ?? 1
          NODE
      - name: Build and type-check repository extension
        if: github.event.pull_request.head.repo.full_name == github.repository
        working-directory: wallet
        env:
          BUILD_CHANNEL: beta
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
          CUSTOM_ANALYTICS_PASSWORD: ${{ secrets.CUSTOM_ANALYTICS_PASSWORD }}
          EVM_HISTORY_API_ORIGIN: ${{ vars.EVM_HISTORY_API_ORIGIN }}
          RHEA_SWAP_ACCESS_TOKEN: ${{ vars.RHEA_SWAP_ACCESS_TOKEN }}
        run: |
          if [ -z "${RHEA_SWAP_ACCESS_TOKEN//[[:space:]]/}" ]; then
            echo '::error::RHEA_SWAP_ACCESS_TOKEN is required for repository preview builds'
            exit 1
          fi
          pnpm build:extension
      - name: Stage tested ZIPs
        run: |
          set -euo pipefail
          zips=(wallet/packages/extension/dist/*.zip)
          if [ "${#zips[@]}" -ne 1 ] || [ ! -f "${zips[0]}" ]; then
            echo '::error::Expected exactly one extension ZIP'
            exit 1
          fi
          mkdir -p raw-zips/dist
          cp "${zips[0]}" raw-zips/dist/
      - name: Package tested previews
        id: package
        env:
          RELEASE_MODE: preview
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          BUILD_CHANNEL: ${{ env.PREVIEW_BUILD_CHANNEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, copyFileSync, mkdirSync, readFileSync, readdirSync, writeFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const { version } = JSON.parse(readFileSync('wallet/packages/extension/package.json', 'utf8'))
          if (!/^\d+\.\d+\.\d+(?:-beta\.[1-9]\d*)?$/.test(version)) throw new Error('Invalid preview version')
          const { SOURCE_SHA, SOURCE_REF, WORKFLOW_SHA, BUILD_CHANNEL, PR_NUMBER, PR_HEAD_SHA, PR_BASE_SHA, GITHUB_REPOSITORY, GITHUB_RUN_ID, GITHUB_RUN_ATTEMPT } = process.env
          const artifactLabel = `v${version.split('-')[0]}-pr.${PR_NUMBER}.${SOURCE_SHA.slice(0, 7)}`
          const zips = readdirSync('raw-zips/dist').filter(name => name.endsWith('.zip'))
          if (zips.length !== 1) throw new Error('Expected one V2 preview ZIP')
          mkdirSync('release-assets')
          const name = `noir-wallet-${artifactLabel}.zip`
          copyFileSync(`raw-zips/dist/${zips[0]}`, `release-assets/${name}`)
          const zip = readFileSync(`release-assets/${name}`)
          const sha256 = createHash('sha256').update(zip).digest('hex')
          const metadata = {
            schemaVersion: 1, mode: 'preview', buildChannel: BUILD_CHANNEL, version,
            sourceSha: SOURCE_SHA, sourceRef: SOURCE_REF, workflowSha: WORKFLOW_SHA,
            repository: GITHUB_REPOSITORY, runId: GITHUB_RUN_ID, runAttempt: GITHUB_RUN_ATTEMPT,
            prNumber: PR_NUMBER, prHeadSha: PR_HEAD_SHA, prBaseSha: PR_BASE_SHA, artifactLabel,
            assets: [{ network: 'multichain', name, sha256, size: zip.length }]
          }
          writeFileSync('release-assets/release-metadata.json', `${JSON.stringify(metadata, null, 2)}\n`)
          writeFileSync('release-assets/SHA256SUMS', `${sha256}  ${name}\n`)
          writeFileSync('release-assets/release-body.md', `PR preview ${version}\n\nTested merge commit: ${SOURCE_SHA}\n`)
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact_label=${artifactLabel}\n`)
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noir-wallet-development-${{ steps.package.outputs.artifact_label }}
          path: release-assets/
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
