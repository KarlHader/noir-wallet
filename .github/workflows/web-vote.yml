name: Website Signup Worker

on:
  push:
    branches: [main]
    paths:
      - 'packages/web-vote/**'
      - 'packages/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.node-version'
      - '.npmrc'
      - 'scripts/register-test-loader.mjs'
      - 'scripts/typescript-test-loader.mjs'
      - '.github/workflows/web-vote.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/web-vote/**'
      - 'packages/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.node-version'
      - '.npmrc'
      - 'scripts/register-test-loader.mjs'
      - 'scripts/typescript-test-loader.mjs'
      - '.github/workflows/web-vote.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-vote-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify signup Worker
        run: pnpm --filter @noir-wallet/web-vote verify
      - name: Verify signup client
        run: |
          pnpm --filter @noir-wallet/web type-check
          pnpm --filter @noir-wallet/web test
          pnpm build:web
